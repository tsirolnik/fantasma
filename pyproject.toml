[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasma"
version = "0.3.0"
description = "A configurable framework for AI-assisted security research"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/tsirolnik/fantasma"
Documentation = "https://github.com/tsirolnik/fantasma/tree/main/docs"

[project.scripts]
fantasma = "fantasma.main:main"
swarmhound = "fantasma.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fantasma", "fantasma.*"]
namespaces = true

[tool.setuptools.package-data]
"fantasma.profiles" = ["*.toml"]
"fantasma.web" = ["*.html"]
"fantasma.templates" = ["*.md"]
"fantasma.docker" = ["Dockerfile.tools"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
