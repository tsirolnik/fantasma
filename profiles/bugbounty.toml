# Example single-team web security profile.
# Both --profile bugbounty and --profile profiles/bugbounty.toml load this file.
# Explicit CLI options override corresponding profile values.

[profile]
name = "bugbounty"
description = "Public bug-bounty web app hunting (the original/default behavior)."

[methodology]
type = "pentest"

[target]
# "auto" = direct --targets if given, else bug-bounty platform discovery
# (HackerOne/Bugcrowd/Intigriti/YesWeHack) + ROI ranking.
provider = "auto"

[topology]
mode = "swarm"
agents_per_team = 4
num_teams = 1

[mechanisms]
# Empty = unmodified baseline scoring/dedup/termination, no additive game-theory layer.
# Try adding e.g. ["first_finder_bonus", "duplicate_escalation"].
enabled = []

[scoring]
default_accepted = 10
rejected = -10
duplicate = -5
termination_threshold = -50

[scoring.accepted]
critical = 50
high = 30
medium = 15
low = 5
