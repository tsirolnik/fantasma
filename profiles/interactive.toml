[profile]
name = "interactive"
description = "User-led terminal pentester: ask, investigate, discuss, and steer"

[topology]
mode = "pentester"
agents_per_team = 1
num_teams = 1

[methodology]
type = "interactive"

[target]
provider = "direct"

[interaction]
mode = "terminal"
max_iterations = 20
max_tool_calls = 50
diagnostics = false  # Console diagnostics are opt-in; file logs remain enabled.

# A single interactive investigator needs scope, not an exclusive swarm claim.
[coordination]
claim_mode = "shared"

[mechanisms]
enabled = []

[llm]
# Load providers and models from .env (process environment takes precedence).
source = "env"
