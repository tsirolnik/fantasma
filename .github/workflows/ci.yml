name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install package and build tooling
        run: python -m pip install . build twine
      - name: Install Chromium for local browser fixtures
        run: python -m playwright install --with-deps chromium
      - name: Test without model credentials or live targets
        run: python -m unittest discover -s tests
      - name: Check generated documentation
        run: python scripts/generate_reference.py --check
      - name: Build distributions
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Smoke test wheel outside checkout
        run: python scripts/check_wheel.py dist/fantasma-*.whl
